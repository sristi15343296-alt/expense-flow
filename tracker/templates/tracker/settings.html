{% extends "tracker/base.html" %}
{% block title %}Settings - ExpenseFlow{% endblock %}
{% block content %}
<div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
  <div class="card">
    <h4 style="font-weight:800; margin-bottom:14px;">Profile</h4>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" class="form-control" value="{{ user.username }}"></div>
      <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ user.email }}"></div>
      <button type="submit" class="btn btn-primary">Save Profile</button>
    </form>
  </div>
  <div class="card">
    <h4 style="font-weight:800; margin-bottom:14px;">Preferences</h4>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3"><label class="form-label">Currency</label><select name="currency" class="form-select"><option value="INR" {% if currency == 'INR' %}selected{% endif %}>₹ Indian Rupee</option><option value="USD" {% if currency == 'USD' %}selected{% endif %}>$ USD</option></select></div>
      <div class="mb-3"><label class="form-label">Theme</label><select name="theme" class="form-select"><option value="light" {% if theme == 'light' %}selected{% endif %}>Light</option><option value="dark" {% if theme == 'dark' %}selected{% endif %}>Dark</option></select></div>
      <button type="submit" class="btn btn-primary">Save Preferences</button>
    </form>
  </div>
</div>
<div class="card" style="margin-top:20px; max-width:420px;">
  <h4 style="font-weight:800; margin-bottom:6px;">Account</h4>
  <a href="/logout/" class="btn btn-danger">Log out</a>
</div>
{% endblock %}
