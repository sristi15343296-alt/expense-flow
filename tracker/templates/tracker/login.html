{% extends "tracker/base.html" %}
{% block title %}Login - ExpenseFlow{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 60px auto; padding: 0 16px;">
  <div style="text-align:center; margin-bottom:30px;">
    <div style="font-size:2.8rem; font-weight:900; color:var(--primary); letter-spacing:-1.5px;">ExpenseFlow</div>
    <div style="color:var(--text-secondary); font-size:0.95rem;">Take control of your money.</div>
  </div>
  <div class="card" style="padding:32px;">
    <h3 style="font-weight:800; margin-bottom:6px;">Welcome back</h3>
    <p style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:22px;">Sign in to continue.</p>
    <form method="post" action="/login/" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autofocus>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100" style="padding:12px; font-weight:700;">Log in</button>
    </form>
    <div style="margin-top:16px; text-align:center; font-size:0.85rem; color:var(--text-secondary);">Don’t have an account? <a href="/register/" style="color:var(--primary); font-weight:600;">Register</a></div>
  </div>
</div>
{% endblock %}
