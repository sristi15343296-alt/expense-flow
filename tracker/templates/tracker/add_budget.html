{% extends "tracker/base.html" %}
{% block title %}Add Budget - ExpenseFlow{% endblock %}
{% block content %}
<div class="card" style="max-width:460px; margin:0 auto;">
  <h2 style="font-weight:800; margin-bottom:4px;">New Budget</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3"><label for="id_category" class="form-label">Category</label><select name="category" id="id_category" class="form-select">{% for c in expense_cats %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></div>
    <div class="mb-3"><label for="id_amount" class="form-label">Amount (₹/month)</label><input type="number" step="0.01" min="0.01" name="amount" id="id_amount" class="form-control" required></div>
    <div class="mb-3"><label for="id_period" class="form-label">Period</label><select name="period" id="id_period" class="form-select"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="yearly">Yearly</option></select></div>
    <button type="submit" class="btn btn-primary w-100" style="padding:12px; font-weight:700;">Save Budget</button>
  </form>
  <a href="/budgets/" class="btn btn-ghost w-100" style="margin-top:10px;">Back</a>
</div>
{% endblock %}
