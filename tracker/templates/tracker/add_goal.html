{% extends "tracker/base.html" %}
{% block title %}Add Savings Goal - ExpenseFlow{% endblock %}
{% block content %}
<div class="card" style="max-width:460px; margin:0 auto;">
  <h2 style="font-weight:800; margin-bottom:4px;">New Savings Goal</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3"><label for="id_name" class="form-label">Name</label><input type="text" name="name" id="id_name" class="form-control" placeholder="e.g. New Laptop" required></div>
    <div class="mb-3"><label for="id_target_amount" class="form-label">Target Amount (₹)</label><input type="number" step="0.01" min="0.01" name="target_amount" id="id_target_amount" class="form-control" required></div>
    <div class="mb-3"><label for="id_current_amount" class="form-label">Current Amount (₹)</label><input type="number" step="0.01" min="0" name="current_amount" id="id_current_amount" class="form-control" value="0"></div>
    <div class="mb-3"><label for="id_target_date" class="form-label">Target Date</label><input type="date" name="target_date" id="id_target_date" class="form-control" required></div>
    <button type="submit" class="btn btn-primary w-100" style="padding:12px; font-weight:700;">Save Goal</button>
  </form>
  <a href="/goals/" class="btn btn-ghost w-100" style="margin-top:10px;">Back</a>
</div>
{% endblock %}
