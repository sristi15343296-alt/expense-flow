{% extends "tracker/base.html" %}
{% block title %}Financial Health - ExpenseFlow{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:30px auto; text-align:center; padding:36px 24px;">
  <h2 style="font-weight:800; font-size:1.4rem; margin-bottom:8px;">Financial Health</h2>
  <div style="font-size:4rem; font-weight:900; color:var(--primary); letter-spacing:-2px;">{{ score }}/100</div>
  <div style="font-weight:700; font-size:1.1rem; color:{% if score >= 80 %}#3cae6e{% elif score >= 60 %}#e8a33b{% else %}#e05a5a{% endif %};">{{ label }}</div>
  <p style="color:var(--text-secondary); font-size:0.9rem; margin-top:14px;">Based on savings rate, expense ratio, and budget adherence.</p>
  <a href="/dashboard/" class="btn btn-primary" style="margin-top:12px;">Back to Dashboard</a>
</div>
{% endblock %}
